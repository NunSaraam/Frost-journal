<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동토일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --w-wood:#B98A57; --w-metal:#A2ADB5; --w-red:#C2553F; --w-blue:#6F9BC0; --w-green:#7E9B6A; --w-skin:#ECCDAD;
  --w-brown:#8A6142; --w-purple:#A58DB8; --w-orange:#E3923A; --w-yellow:#F2C94C; --w-white:#F6F4EE; --w-pink:#DB8F88;
  --w-navy:#46566E; --w-skyd:#C9D8E3; --w-skyn:#26334A;
  --desk:#33414C; --desk2:#1E272E; --desk-ink:#C4CED4;
  --paper:#E7EBE8; --paper-line:#CBD5D8; --margin:#D3A7A1;
  --ink:#1F2B36; --pencil:#5E6A74; --frost:#C9DCE7;
  --ember:#C9461F; --danger:#9B2A24; --good:#3D6A4E;
  --cover:#3B4C58; --cover-ink:#E7EBE8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1A2127; --desk2:#0D1114; --desk-ink:#9AA6AD;
    --paper:#2C3337; --paper-line:#3F494F; --margin:#6A4945;
    --ink:#E2E7E9; --pencil:#A1ADB5; --frost:#56768A;
    --ember:#F07A4B; --danger:#E46A60; --good:#82B391;
    --cover:#25313A; --cover-ink:#E2E7E9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#1A2127; --desk2:#0D1114; --desk-ink:#9AA6AD;
  --paper:#2C3337; --paper-line:#3F494F; --margin:#6A4945;
  --ink:#E2E7E9; --pencil:#A1ADB5; --frost:#56768A;
  --ember:#F07A4B; --danger:#E46A60; --good:#82B391;
  --cover:#25313A; --cover-ink:#E2E7E9;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;
  background:radial-gradient(ellipse at 50% 20%,var(--desk) 0%,var(--desk2) 80%) fixed;
  background-color:var(--desk2);
  color:var(--ink);
  font-family:'Gowun Batang','Nanum Myeongjo','AppleMyungjo','Batang',serif;
  font-size:16px;line-height:1.6;
}
.hand{font-family:'Nanum Pen Script','Gaegu','Comic Sans MS',cursive}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 40px}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--desk-ink);margin-bottom:14px;flex-wrap:wrap}
.topbar .brand{font-size:1.9rem;line-height:1}
.topbar .tools{display:flex;gap:16px;align-items:center;font-size:.9rem}
.topbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.link{background:none;border:0;color:var(--desk-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0}

/* book */
.book{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:4px 10px 10px 4px;box-shadow:0 22px 50px rgba(0,0,0,.4);min-height:660px}
.book::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:44px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.10) 42%,rgba(0,0,0,.2) 50%,rgba(0,0,0,.10) 58%,transparent);pointer-events:none}
.frost{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse at center,transparent 48%,var(--frost) 100%);opacity:var(--f,0);transition:opacity 1.4s ease;z-index:3}
.page{position:relative;padding:40px 46px 34px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--paper-line) 35px,var(--paper-line) 36px);background-position:0 104px;min-width:0}
.page.left::before{content:'';position:absolute;top:0;bottom:0;left:30px;width:1px;background:var(--margin)}
.book.turn .page{animation:turn .65s ease both}
@keyframes turn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* left page */
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;min-height:68px}
.dayhead h1{margin:0;font-size:3rem;line-height:1;font-weight:400}
.weather{color:var(--pencil);font-size:1.35rem;line-height:1.2;margin-top:4px}
.sketch{width:120px;flex:none;color:var(--pencil)}
.sketch svg{width:100%;height:auto;display:block}
.entry{font-size:1.62rem;line-height:36px;margin-top:0;min-height:216px}
.entry p{margin:0}
.entry p.new{animation:write 1s ease-out both}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.entry p.other{font-family:'Gowun Batang',serif;font-size:1rem;color:var(--pencil);font-style:italic}
.entry.shaky p:nth-child(odd){transform:rotate(-.7deg) translateX(2px);letter-spacing:.04em}
.entry.shaky p:nth-child(even){transform:rotate(.5deg);letter-spacing:-.02em}
.pnav{display:flex;justify-content:space-between;margin-top:10px;min-height:28px}
.pnav button{background:none;border:0;color:var(--pencil);cursor:pointer;font-size:1.3rem;padding:2px 4px}
.pnav button:disabled{visibility:hidden}
.viewing{font-size:.85rem;color:var(--pencil);text-align:center}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;margin-top:22px;padding-top:14px;border-top:1.5px dashed var(--pencil);background:var(--paper)}
.stat .nm{font-size:1.4rem;line-height:1}
.segs{display:flex;gap:3px;margin:5px 0 2px}
.seg{width:15px;height:9px;border:1.5px solid var(--ink);border-radius:2px 4px 2px 3px}
.seg.on{background:var(--ink)}
.stat.lv2 .seg{border-color:var(--danger)}
.stat.lv2 .seg.on{background:var(--danger)}
.stat .st{font-size:.8rem;color:var(--pencil)}
.stat.lv2 .st{color:var(--danger);font-weight:700}

/* right page */
.tabs{display:flex;gap:6px;margin:-8px 0 18px;border-bottom:1.5px solid var(--pencil)}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;padding:2px 9px 4px;font-family:'Nanum Pen Script',cursive;font-size:1.6rem;color:var(--pencil);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ap{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:1.45rem}
.ap .dots{display:flex;gap:7px}
.ap .dot{width:20px;height:20px;border:2px solid var(--ink);border-radius:50%;position:relative}
.ap .dot.used::after{content:'';position:absolute;left:-3px;right:-3px;top:50%;height:2px;background:var(--ink);transform:rotate(-35deg)}
.acts{display:flex;flex-direction:column;gap:2px}
.act{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:7px 6px;border-radius:6px;cursor:pointer}
.act:not(:disabled):hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.act .box{width:22px;height:22px;border:2px solid var(--ink);border-radius:3px 6px 4px 3px;flex:none;margin-top:5px}
.act .t{font-family:'Nanum Pen Script',cursive;font-size:1.6rem;line-height:1.15;display:block}
.act .d{font-size:.84rem;color:var(--pencil);display:block}
.act .why{font-size:.8rem;color:var(--danger);display:block}
.act:disabled{cursor:not-allowed}
.act:disabled .t,.act:disabled .box{opacity:.4}
.note{font-size:.88rem;color:var(--pencil);margin:12px 0}
.hr{border:0;border-top:1.5px dashed var(--pencil);margin:16px 0}
.btn{display:inline-block;font-family:'Nanum Pen Script',cursive;font-size:1.6rem;line-height:1.2;background:transparent;border:2px solid var(--ink);padding:6px 22px;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn.ember{border-color:var(--ember);color:var(--ember)}
.row-end{display:flex;justify-content:flex-end;margin-top:18px}
.back{background:none;border:0;color:var(--pencil);cursor:pointer;font-size:.9rem;padding:4px 0;margin-bottom:6px;text-decoration:underline;text-underline-offset:3px}

.event-text{font-size:1.7rem;line-height:36px;margin:0 0 14px}

.fires{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.fire{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:none;border:2px solid var(--pencil);border-radius:14px 6px 12px 8px;padding:12px 8px 14px;cursor:pointer}
.fire:not(:disabled):hover{border-color:var(--ink)}
.fire.f2{border-color:var(--ember)}
.fire svg{width:64px;height:64px}
.fire .t{font-family:'Nanum Pen Script',cursive;font-size:1.7rem;line-height:1}
.fire .d{font-size:.8rem;color:var(--pencil)}
.fire .r{font-size:.82rem}
.fire:disabled{opacity:.4;cursor:not-allowed}
.forecast{font-size:1.5rem;line-height:1.3;margin:0 0 6px}

.inv{display:flex;flex-direction:column}
.irow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dotted var(--paper-line)}
.irow .nm{font-family:'Nanum Pen Script',cursive;font-size:1.5rem;line-height:1.1}
.irow .d{font-size:.8rem;color:var(--pencil)}
.mini{background:none;border:1.5px solid var(--ink);border-radius:12px 4px 10px 5px;padding:3px 12px;cursor:pointer;font-size:.85rem;flex:none}
.mini:disabled{opacity:.35;cursor:not-allowed}
.tag{font-size:.8rem;color:var(--good);flex:none}
.need{font-size:.82rem}
.need .miss{color:var(--danger)}
.need .ok{color:var(--good)}

.ending h2{font-family:'Nanum Pen Script',cursive;font-weight:400;font-size:3rem;line-height:1;margin:4px 0 14px}
.ending p{margin:0 0 12px}
.ending dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:16px 0;font-size:.92rem}
.ending dt{color:var(--pencil)}
.ending dd{margin:0}

/* cover */
.cover-wrap{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:24px 0}
.cover{position:relative;width:min(460px,100%);min-height:620px;background:var(--cover);color:var(--cover-ink);border-radius:6px 14px 14px 6px;box-shadow:0 26px 60px rgba(0,0,0,.5),inset 10px 0 0 rgba(0,0,0,.18);padding:56px 40px 40px;display:flex;flex-direction:column;overflow:hidden}
.cover::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 100% 0%,rgba(220,235,245,.35),transparent 45%),radial-gradient(ellipse at 0% 100%,rgba(220,235,245,.25),transparent 40%);pointer-events:none}
.cover .label{border:1.5px solid var(--cover-ink);border-radius:4px;padding:18px 20px;text-align:center;position:relative;background:color-mix(in srgb,var(--cover-ink) 8%,transparent)}
.cover h1{font-family:'Nanum Pen Script',cursive;font-weight:400;font-size:4.6rem;line-height:1;margin:0}
.cover .sub{font-size:.95rem;opacity:.85;margin-top:8px}
.cover .lead{margin:28px 4px 0;font-family:'Nanum Pen Script',cursive;font-size:1.6rem;line-height:1.35;position:relative}
.cover .btns{margin-top:auto;display:flex;flex-direction:column;gap:12px;align-items:center;position:relative}
.cover .btn{border-color:var(--cover-ink);color:var(--cover-ink);min-width:220px;text-align:center}
.cover .seen{font-size:.82rem;opacity:.8;text-align:center;position:relative;margin-top:14px}

.ic{display:inline-block;width:1em;height:1em;vertical-align:-.12em;margin-right:.18em}
.ic svg,.icon svg{width:100%;height:100%;display:block}
.act .icon{width:30px;height:30px;flex:none;margin-top:2px}
.act:disabled .icon{opacity:.4}
.odds{display:block;font-size:.8rem;color:var(--good);font-weight:700}
.odds.mid{color:var(--pencil)}
.odds.low{color:var(--danger)}
.iwrap{display:flex;gap:10px;align-items:flex-start}
.iwrap .icon{width:30px;height:30px;flex:none;margin-top:3px}
.zcard{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--pencil);border-radius:14px 6px 12px 8px;padding:12px 14px;margin:0 0 14px}
.zcard>svg{width:76px;height:76px;flex:none}
.zcard .zn{font-family:'Nanum Pen Script',cursive;font-size:1.8rem;line-height:1}
.zcard .d{font-size:.86rem;margin-top:2px}
.zcard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:.84rem}
.zcard dt{color:var(--pencil)}
.zcard dd{margin:0}
.zcard.unknown{border-style:dashed;opacity:.75}
.zcard .note{margin:4px 0 0}
.report .rhead{align-items:center;margin-bottom:14px}
.report .rhead .icon{width:36px;height:36px}
.report .rhead h2{margin:0;font-weight:400;font-size:2.1rem;line-height:1}
.report p.hand{font-size:1.55rem;line-height:1.35;margin:0 0 10px}
.gain{border:1.5px dashed var(--pencil);border-radius:12px 5px 10px 6px;padding:10px 14px;margin:12px 0}
.gain .lb{font-size:.85rem;color:var(--pencil)}
.gain.extra{border-color:var(--good)}
.gain.extra .lb{color:var(--good);font-weight:700}
.gain.empty .lb{font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:6px}
.chip{display:flex;align-items:center;gap:6px;font-family:'Nanum Pen Script',cursive;font-size:1.55rem;line-height:1}
.chip .icon{width:28px;height:28px}
.pickl{font-size:.85rem;opacity:.85;margin-top:6px}
.diffs{display:flex;flex-direction:column;gap:10px;width:100%}
.diff{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:transparent;color:var(--cover-ink);border:1.5px solid var(--cover-ink);border-radius:14px 6px 12px 8px;padding:10px 16px;cursor:pointer}
.diff:hover{background:color-mix(in srgb,var(--cover-ink) 10%,transparent)}
.diff.rec{border-width:2.5px}
.diff .t{font-family:'Nanum Pen Script',cursive;font-size:1.9rem;line-height:1}
.diff .d{font-size:.82rem;opacity:.85}
.tagc{font-family:'Gowun Batang',serif;font-size:.75rem;border:1px solid var(--cover-ink);border-radius:8px;padding:1px 7px;vertical-align:middle}
.scene{position:relative;height:216px;margin:0;padding:8px;background:var(--paper);border:1.5px solid var(--pencil);border-radius:3px;transform:rotate(-.5deg);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.scene svg{display:block;width:100%;height:100%;color:var(--ink)}
.scene .k *{stroke:none!important}
.scene .k [fill]:not([fill="none"]){fill:var(--paper)!important;fill-opacity:1!important}
.scene .k .ink,.scene .k .cs,.scene .k .nk,.scene .k text{display:none}
.scene .f *:not(.cs){stroke:none!important}
.scene .f [fill-opacity]{fill-opacity:.95}
.scene .f .soft{fill-opacity:.4}
.scene .f .tint{fill-opacity:.4}
.scene .f .ink,.scene .f text{display:none}
.scene .l *:not(.ink):not(text){fill:none!important}
.scene .l .cs{display:none}
.scene .flk{animation-name:sc-fall;animation-iteration-count:infinite;animation-timing-function:steps(14)}
.scene .flk.slant{animation-name:sc-slant}
@keyframes sc-fall{0%{transform:translate(0,-84px)}50%{transform:translate(5px,-36px)}100%{transform:translate(0,12px)}}
@keyframes sc-slant{0%{transform:translate(-24px,-84px)}100%{transform:translate(20px,12px)}}
.scene .swirl{stroke-dasharray:80 116;animation:sc-swirl 1.7s linear infinite}
.scene .swirl.slow{animation-duration:3.4s}
@keyframes sc-swirl{from{stroke-dashoffset:196}to{stroke-dashoffset:0}}
.scene .flame{transform-box:fill-box;transform-origin:50% 100%;animation:sc-flick .45s ease-in-out infinite alternate}
@keyframes sc-flick{from{transform:scale(1,1)}to{transform:scale(.88,1.12)}}
.scene .smoke{animation:sc-smoke 3s ease-in-out infinite alternate}
@keyframes sc-smoke{to{transform:translate(3px,-3px);opacity:.2}}
.scene .blink{animation:sc-blink 1.2s steps(2) infinite}
@keyframes sc-blink{50%{opacity:.15}}
.scene .shiver{animation:sc-shiver .11s linear infinite alternate}
@keyframes sc-shiver{from{transform:translateX(-.9px)}to{transform:translateX(.9px)}}
.scene .rattle{animation:sc-shiver .18s linear infinite alternate}
.scene::before,.scene::after{content:'';position:absolute;top:-8px;width:54px;height:16px;background:color-mix(in srgb,var(--pencil) 28%,transparent)}
.scene::before{left:18px;transform:rotate(-5deg)}
.scene::after{right:18px;transform:rotate(6deg)}
.eff{font-size:.78rem;color:var(--ink);opacity:.8}
/* feedback 11/18: mobile reachability */
.page{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 8px)}
.mstat{display:none}
.foldbtn{display:none}
.qbar{display:none}
@media (max-width:820px){
  body{padding-bottom:72px}
  .mstat{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:-6px 0 16px;padding:10px 12px;border:1.5px dashed var(--pencil);border-radius:10px;background:var(--paper)}
  .ms{font-size:.85rem;display:flex;align-items:center;gap:4px}
  .ms b{margin-left:auto;font-weight:700;color:var(--pencil)}
  .ms.lv1 b{color:var(--ink)}
  .ms.lv2 b{color:var(--danger)}
  .foldbtn{display:inline-block;position:absolute;top:30px;right:22px;background:none;border:1.5px solid var(--pencil);border-radius:12px 4px 10px 5px;padding:3px 10px;font-size:.82rem;color:var(--pencil);cursor:pointer;z-index:2}
  .page.folded .scene,.page.folded .entry,.page.folded .pnav{display:none}
  .page.folded .stats{display:none}
  .page.folded{padding-bottom:12px}
  .qbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1.5px solid var(--pencil);box-shadow:0 -6px 16px rgba(0,0,0,.25)}
  .qap{font-family:'Nanum Pen Script',cursive;font-size:1.35rem}
  .qbtns{display:flex;gap:8px}
  .qbar button{font-family:'Nanum Pen Script',cursive;font-size:1.3rem;background:none;border:1.5px solid var(--ink);border-radius:14px 5px 12px 6px;padding:4px 14px;cursor:pointer;color:var(--ink)}
  .qbar button.pri{background:var(--ink);color:var(--paper)}
}
@media (max-width:820px){
  .book{grid-template-columns:1fr;min-height:0}
  .book::after{display:none}
  .page{padding:30px 22px 26px 34px}
  .page.right{padding-left:22px;border-top:2px dashed var(--paper-line)}
  .page.left::before{left:18px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .dayhead h1{font-size:2.5rem}
  .sketch{width:92px}
  .fires{grid-template-columns:1fr}
  .fire{flex-direction:row;text-align:left;gap:12px}
  .fire svg{width:48px;height:48px;flex:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(() => {
'use strict';
const app = document.getElementById('app');
const SAVE = 'frostjournal-save-v1';
const ENDS = 'frostjournal-endings-v1';
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const chance = p => Math.random() < p;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = v => Math.max(0, Math.min(100, Math.round(v)));

let S = null;
let rendered = {};
let confirmRestart = false;

/* ---------- data ---------- */
const STATS = [
  {k:'health', n:'체력'}, {k:'warmth', n:'체온'}, {k:'hunger', n:'허기'}, {k:'thirst', n:'갈증'},
  {k:'fatigue', n:'피로'}, {k:'infection', n:'감염', inv:true}, {k:'sanity', n:'정신력'}
];

const KEEP = [
  '낡은 가족사진을 오래 들여다봤다.',
  '누군가의 편지를 다시 읽었다. 끝에 “꼭 다시 만나”라고 적혀 있었다.',
  '아이 장난감 자동차의 바퀴를 굴려 봤다. 끼릭끼릭 소리가 났다.'
];

const I = {
  wood:{n:'장작', d:'불을 피우거나 바리케이드를 보수한다.'},
  plank:{n:'판자', d:'바리케이드 보수, 제작 재료.'},
  gas:{n:'휘발유', d:'횃불 재료.'},
  cloth:{n:'천', d:'횃불 재료.'},
  nails:{n:'못', d:'보강 바리케이드 재료.'},

const inv = k => S.inv[k] || 0;

const addLine = t => { S.journal[S.day].push(t); };

const loseWarm = n => { S.st.warmth -= n * (1 - cloth()) * (S.st.fatigue <= 30 ? 1.5 : 1); };
const tfmt = t => t < 0 ? `영하 ${-t}도` : t === 0 ? '0도' : `영상 ${t}도`;

function save(){

}

}

}
function seenAll(){

}
function seenEndings(diff){
  const d = diff || (S && S.diff) || 'normal';
  return seenAll().filter(x => x.startsWith(d + ':')).map(x => x.split(':')[1]);
}
function markEnding(t){
  try { const a = seenAll(), key = S.diff + ':' + t; if (!a.includes(key)) { a.push(key); localStorage.setItem(ENDS, JSON.stringify(a)); } } catch (e) {}
}

/* ---------- new game ---------- */
function newGame(diff){
  const temps = [0], bliz = [false];
  for (let d = 1; d <= 31; d++) {
    temps.push(d <= 10 ? rand(-30, -15) : d <= 20 ? rand(-20, -10) : rand(-9, 1));
    bliz.push(chance(d <= 20 ? .15 : .07));
  }
  S = {
    day:1, phase:'day', ap:3,
    st:{health:100, warmth:75, hunger:70, thirst:65, fatigue:80, infection:0, sanity:70},
    inv:{wood:3, can:2, water:1, bandage:1, plank:2, hat:1, keepsake:1},
    diff:diff || 'normal', defense:30, traps:0, visits:{}, temps, bliz,
    flags:{}, zero:{}, companion:false, signalDay:0,
    count:{explore:0, raids:0}, used:[], seen:{},
    journal:{1:[
      (DIFF[diff] || DIFF.normal).first,
      '마지막 방송은 봄이 오면 헬기가 온다고 했다. 봄까지는 한 달.',
      '장작 세 개, 통조림 두 개. 문은 판자로 대충 막아 두었다.',
      '불을 피우면 따뜻하다. 그리고 감염자들이 온다.',
      '라디오가 마지막으로 알려 준 것: 감염자는 추위에 굳고, 불빛과 온기에 모여든다.'
    ]},
    ev:null, ended:null,
    ui:{tab:'act', explore:false, view:null, num:S && S.ui ? S.ui.num : false}
  };
  rendered = {};
  save();
}

/* ---------- day actions ---------- */
function spendAP(n){ S.ap -= n; }
function fatigueCost(n){ S.st.fatigue -= S.st.thirst <= 0 ? n * 2 : n; }

function doGather(){
  if (S.ap < 1) return;
  spendAP(1);
  let n = rand(2, 4) + (has('axe') ? 1 : 0);
  if (S.st.warmth <= 0) n = Math.max(1, Math.floor(n / 2));
  give('wood', n);
  fatigueCost(5); loseWarm(5);
  addLine(`숲 가장자리에서 [[wood]]장작 ${n}개를 모았다.`);
  after();
}
function doWarm(){
  if (S.ap < 1 || !has('wood')) return;
  spendAP(1);
  take('wood', 1);
  S.st.warmth += D().warm; S.st.fatigue += 5;
  S.flags.smoke = S.day;
  addLine('낮에 잠깐 난로를 피워 몸을 녹였다. 굴뚝 연기가 마음에 걸린다.');
  after();
}
function doRest(){
  if (S.ap < 1) return;
  spendAP(1);
  S.st.fatigue += 15; S.st.health += 5;
  addLine('담요를 뒤집어쓰고 한동안 눈을 붙였다.');
  after();
}
function doWrite(){
  if (S.ap < 1) return;
  spendAP(1);
  S.st.sanity += 10;
  S.flags.forecastDay = S.day;
  const t = S.temps[S.day], b = S.bliz[S.day];
  addLine(`하늘을 오래 보며 적었다. 오늘 밤은 ${tfmt(t)}쯤 될 것 같다.${b ? ' 바람 냄새가 수상하다. 눈보라가 올지도.' : ''}`);
  after();
}
function doRepair(){
  if (S.ap < 1) return;
  if (has('plank')) take('plank', 1); else if (has('wood')) take('wood', 1); else return;
  spendAP(1);
  S.defense = Math.min(100, S.defense + 20);
  fatigueCost(5);
  addLine('바리케이드의 틈을 메웠다.');
  after();
}
function doSnow(){
  if (S.flags.snowDay === S.day) return;
  S.flags.snowDay = S.day;
  S.st.thirst += 10; loseWarm(10);
  addLine('눈을 한 움큼 퍼서 그냥 삼켰다. 속까지 얼어붙는 것 같다.');
  after();
}
function doCraft(id){
  const r = RECIPES.find(x => x.id === id);
  if (!r || S.phase !== 'day' || S.ap < 1 || !canCraft(r)) return;
  for (const k in r.m) take(k, r.m[k]);
  spendAP(1);
  addLine(r.fx());
  after();
}
function canCraft(r){
  if (r.once && has(r.once)) return false;
  return Object.keys(r.m).every(k => inv(k) >= r.m[k]);
}
function doUse(k){
  const it = I[k];
  if (!it || !it.fx || !has(k) || S.phase === 'end' || S.phase === 'event') return;
  take(k, 1);
  addLine(it.fx());
  after();
}
function after(){
  norm();
  if (S.st.infection >= 100) { end('death', 'infection'); }
  else if (S.st.health <= 0 && !S.ended) { end('death', 'health'); }
  save(); render();
}

/* ---------- exploring ---------- */
function exploreBlocked(){
  if (S.ap < 2) return '행동력이 2 필요하다.';
  if (S.bliz[S.day - 1]) return '어젯밤 눈보라로 길이 묻혔다. 오늘은 나갈 수 없다.';
  return '';
}
function pickZ(){
  const t = S.temps[S.day], o = ['hunter'];
  if (t <= -15) o.push('frozen', 'frozen', 'frozen'); else o.push('moth');
  if (S.day >= 21) o.push('thawed', 'thawed');
  return pick(o);
}
function explore(id){
  const L = LOCS[id];
  if (exploreBlocked()) return;
  if (L.far && S.st.sanity <= 0) return;
  spendAP(2);
  S.count.explore++;
  const v = S.visits[id] || 0;
  S.visits[id] = v + 1;
  fatigueCost(10); loseWarm(10);
  const loot = [];
  let total = 0;
  for (const [k, a, b, p] of L.loot) {
    if ((I[k].wear || I[k].uniq) && has(k)) continue;
    if (chance(p * Math.pow(D().dep, v) * (D().med[k] ?? 1) * (S.st.warmth <= 0 ? .5 : 1))) {
      let n = rand(a, b);
      n = Math.min(n, 10 - total);
      if (n > 0) { loot.push([k, n]); total += n; }
    }
  }
  S.report = {loc:id, from:S.journal[S.day].length};
  addLine(`${L.n}에 다녀왔다.`);
  let risk = L.risk;
  const t = S.temps[S.day];
  if (t <= -20) risk *= .5; else if (t >= -10) risk *= 1.4;
  risk *= threat();
  const ctx = {loc:id, loot, keep:1, baseN:loot.length};
  norm();
  if (chance(risk)) {
    ctx.z = pickZ();
    S.ev = {id:'zombie', ctx}; S.phase = 'event';
  } else {
    let pool = L.ev.filter(e => !(e === 'survivor' && S.flags.met));
    const fresh = pool.filter(e => !S.used.includes(e));
    if (fresh.length) pool = fresh;
    if (pool.length && chance(.75)) {
      const id = pick(pool); S.used.push(id);
      if (EV[id].auto) runAuto(id, ctx); else { S.ev = {id, ctx}; S.phase = 'event'; }
    } else {
      addLine('별일은 없었다.');
      finishExplore(ctx);
    }
  }
  S.ui.explore = false;
  norm(); if (S.st.infection >= 100 && !S.ended) end('death', 'infection'); if (S.st.health <= 0 && !S.ended) end('death', 'health');
  save(); render(); jump('.page.right');
}
function lootGroup(list, keep){
  const sum = {};
  for (const [k, n0] of list) sum[k] = (sum[k] || 0) + n0;
  const got = [];
  for (const k in sum) {
    let n = sum[k];
    if (keep < 1) { const raw = n * keep; n = Math.floor(raw); if (chance(raw - n)) n++; }
    if (n <= 0) continue;
    if (I[k].wear || I[k].uniq) { if (has(k)) continue; n = 1; }
    give(k, n);
    got.push(`[[${k}]]${I[k].n} ${n}`);
  }
  return got;
}
function grantLoot(c){
  const bn = c.baseN ?? c.loot.length;
  const base = lootGroup(c.loot.slice(0, bn), c.keep);
  const extra = lootGroup(c.loot.slice(bn), c.keep);
  if (c.home) { const all = base.concat(extra); if (all.length) addLine(`얻은 것: ${all.join(', ')}.`); return; }
  if (!base.length && !extra.length) { addLine('빈손으로 돌아왔다.'); return; }
  if (base.length) addLine(`가져온 것: ${base.join(', ')}.`);
  if (extra.length) addLine(`덕분에 더 얻은 것: ${extra.join(', ')}.`);
}
function runAuto(id, c){
  const E = EV[id];
  addLine(E.t(c));
  const r = E.c[0].go(c);
  if (S.ended) return;
  if (r && typeof r === 'object') { addLine(r.t); S.ev = r.next; S.phase = 'event'; return; }
  if (r) addLine(r);
  finishExplore(c);
}
function finishExplore(c){
  if (c.loot) grantLoot(c);
  S.ev = null;
  S.phase = c.loc && S.report ? 'report' : 'day';
}

function hurtWolf(prefix){
  S.st.health -= 30; S.st.sanity -= 5;
  return prefix + '피가 많이 났다. 늑대는 감염자가 아니니 감염 걱정은 없다.';
}
function hurt(prefix){
  if (chance(.4)) { S.st.infection += 20; S.st.health -= 15; return prefix + '팔을 물렸다. 피가 잘 멈추지 않는다.'; }
  S.st.health -= 35; S.st.sanity -= 5;
  return prefix + '놈에게 밀려 넘어지며 크게 다쳤다. 다행히 물리지는 않았다.';
}
function fight(c, base){
  const p = zOdds(c, base);
  if (chance(p)) {
    S.st.sanity -= 5;
    return pick(['쓰러뜨렸다. 손이 한참 떨렸다.', '해치웠다. 다시는 일어나지 않았다.', '간신히 처리했다. 숨이 차서 한참 주저앉아 있었다.']);
  }
  c.keep = .5;
  return hurt('막아 내지 못했다. ');
}

function choose(i){
  if (!S.ev) return;
  const E = EV[S.ev.id], ch = E.c[i], c = S.ev.ctx;
  if (!ch || (ch.req && !ch.req())) return;

  }

  finishExplore(c);
  after();
  jump('.page.right');
}

/* ---------- night ---------- */
function raidChance(f, known){
  let p = FIRE[f].p * threat();
  const bst = S.flags.boost;
  if (bst && bst.day === S.day) p += bst.add;
  if (S.flags.smoke === S.day) p += .1;
  if (known) {
    const t = S.temps[S.day];
    if (t <= -20) p *= .5; else if (t >= -10) p *= 1.5;

}
function raid(f, t){

  S.count.raids++;

}
const FLAVOR = [
  () => { S.st.sanity -= 5; return '멀리서 늑대 우는 소리가 밤새 이어졌다.'; },
  () => { S.st.sanity += 5; return '꿈에 따뜻한 부엌이 나왔다. 누군가 국을 끓이고 있었다.'; },

  () => { S.st.sanity -= 5; return '멀리서 불나방 무리가 눈 위를 지나가는 소리가 들렸다. 숨을 죽였다.'; }
];
function night(f){
  const F = FIRE[f];

  const d = S.day, t = S.temps[d], bl = S.bliz[d], L = [];

    w = w * (1 - cloth()) * (S.st.fatigue <= 30 ? 1.5 : 1);
  }
  S.st.warmth += w;
  let line = ['불을 피우지 않았다. 담요를 세 겹 덮고 떨었다.', '작은 불을 피웠다. 손을 녹일 만큼만.', '난로 가득 장작을 넣었다. 오랜만에 땀이 났다.'][f];

  if (chance(raidChance(f, true))) { raided = true; L.push(...raid(f, t)); }
  else if (chance(.45)) L.push(pick(FLAVOR)());

  S.st.hunger -= D().hunger + (S.companion ? 3 : 0);

  S.st.sanity -= S.companion ? 2 : 5;

  for (const k of ['warmth', 'hunger', 'thirst', 'fatigue']) {

  if (st.fatigue <= 0) m.push('몸이 말을 듣지 않는다. 오늘은 한 가지밖에 못 하겠다.');
  addLine(m.length ? m.join(' ') : pick(['몸은 그럭저럭 버티고 있다.', '오늘도 눈을 떴다.', '아직은 괜찮다. 아직은.']));
  if (S.signalDay) addLine(`신호를 보낸 지 ${S.day - S.signalDay}일째. 잡음뿐이다.`);

      <dt>찾은 엔딩</dt><dd>${seen.length} / 4 (${Object.keys(ENDINGS).map(k => seen.includes(k) ? ENDINGS[k].t : '???').join(', ')})</dd>
    </dl>
    <button class="btn" data-a="cover">새 일지를 펼친다</button>
  </div>`;
}
function mstatHTML(){
  return `<div class="mstat" aria-label="현재 상태">${STATS.map(s2 => {
    const v = S.st[s2.k], h = s2.inv ? 100 - v : v, lv = h > 60 ? 0 : h > 30 ? 1 : 2;
    return `<span class="ms lv${lv}">${icon('st_' + s2.k)}${s2.n} <b>${['양호', '주의', '위험'][lv]}</b></span>`;
  }).join('')}</div>`;
}
function rightPage(){
  let body;
  if (S.phase === 'end') body = endView();
  else if (S.phase === 'report') body = reportView();
  else if (S.phase === 'event') body = mstatHTML() + eventView();
  else {
    const tabs = [['act', S.phase === 'night' ? '밤' : '행동'], ['inv', '소지품'], ['craft', '제작'], ['book', '도감']];
    const tabHTML = `<div class="tabs" role="tablist">${tabs.map(([k, n]) => `<button class="tab" role="tab" aria-selected="${S.ui.tab === k}" data-a="tab:${k}">${n}</button>`).join('')}</div>`;
    const v = S.ui.tab === 'book' ? bookView() : S.ui.tab === 'inv' ? invView() : S.ui.tab === 'craft' ? craftView() : S.phase === 'night' ? nightView() : actionsView();
    body = mstatHTML() + tabHTML + v;
  }
  return `<section class="page right" aria-label="선택">${body}</section>`;
}
function render(){
  if (!S) return renderCover();
  const f = Math.max(0, (60 - S.st.warmth) / 60) * .95;
  app.innerHTML = `<div class="topbar">
      <div class="brand hand">동토일지 <small style="font-size:1.1rem;opacity:.75">· ${D().n}</small></div>
      <div class="tools">
        <label><input type="checkbox" data-a="num" ${S.ui.num ? 'checked' : ''}> 숫자 보기</label>
        <button class="link" data-a="restart">${confirmRestart ? '정말 처음부터? 한 번 더 누르세요' : '처음부터'}</button>
      </div>
    </div>
    <div class="book" style="--f:${f.toFixed(2)}">${leftPage()}${rightPage()}<div class="frost" aria-hidden="true"></div></div>
    ${S.phase !== 'end' ? `<nav class="qbar" aria-label="빠른 이동"><span class="qap">${S.phase === 'day' ? `행동력 ${S.ap}/${maxAP()}` : S.phase === 'night' ? '밤 · 불을 고를 차례' : '선택 중'}</span><span class="qbtns"><button data-a="go-journal">일지</button><button class="pri" data-a="go-act">${S.phase === 'night' ? '불 고르기' : S.phase === 'day' ? '행동' : '선택지'}</button></span></nav>` : ''}`;
}
function renderCover(){
  const sv = loadSave();
  const cont = sv && !sv.ended ? `<button class="btn" data-a="continue">이어서 쓰기 (${(DIFF[sv.diff] || DIFF.easy).n} · ${sv.day}일째)</button>` : '';
  const diffs = Object.entries(DIFF).map(([k, v]) => {
    const n = seenEndings(k).length;
    return `<button class="diff${v.rec ? ' rec' : ''}" data-a="new:${k}"><span class="t">${v.n}${v.rec ? ' <span class="tagc">추천</span>' : ''}</span><span class="d">${v.d}</span>${n ? `<span class="d">찾은 엔딩 ${n} / 4</span>` : ''}</button>`;
  }).join('');
  app.innerHTML = `<div class="cover-wrap"><div class="cover">
    <div class="label"><h1>동토일지</h1><div class="sub">혹한의 서른 날</div></div>
    <p class="lead">불을 피우면 얼어 죽지 않는다.<br>그리고 불빛은 감염자를 부른다.</p>
    <div class="btns">${cont}<div class="pickl">새 일지 · 겨울의 혹독함을 고른다</div><div class="diffs">${diffs}</div></div>
  </div></div>`;
}

/* ---------- input ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const [a, arg] = el.dataset.a.split(':');
  if (a !== 'restart' && confirmRestart) confirmRestart = false;
  switch (a) {
    case 'new': newGame(arg); render(); window.scrollTo(0, 0); break;
    case 'cover': clearSave(); S = null; render(); window.scrollTo(0, 0); break;
    case 'continue': S = loadSave(); if (S) { S.ui = S.ui || {tab:'act'}; S.used = S.used || []; S.seen = S.seen || {}; S.diff = S.diff || 'easy'; if (S.st.health === undefined) S.st.health = 100; S.ui.view = null; rendered = {}; } render(); break;
    case 'restart':
      if (confirmRestart) { confirmRestart = false; clearSave(); S = null; render(); }
      else { confirmRestart = true; render(); setTimeout(() => { if (confirmRestart) { confirmRestart = false; if (S) render(); } }, 3500); }
      break;
    case 'num': S.ui.num = el.checked; save(); render(); break;
    case 'tab': S.ui.tab = arg; render(); break;
    case 'page': {
      const days = Object.keys(S.journal).map(Number).sort((x, y) => x - y);
      const cur = S.ui.view || S.day;
      const next = days[days.indexOf(cur) + Number(arg)];
      if (next) S.ui.view = next === S.day ? null : next;
      render(); break;
    }
    case 'explore-open': S.ui.explore = true; render(); break;
    case 'explore-close': S.ui.explore = false; render(); break;
    case 'go': explore(arg); break;
    case 'gather': doGather(); break;
    case 'rest': doRest(); break;
    case 'warm': doWarm(); break;
    case 'report-ok': S.phase = 'day'; S.report = null; save(); render(); jump('.page.right'); break;
    case 'write': doWrite(); break;
    case 'repair': doRepair(); break;
    case 'snow': doSnow(); break;
    case 'craft': doCraft(arg); break;
    case 'use': doUse(arg); break;
    case 'dusk': S.phase = 'night'; S.ui.tab = 'act'; save(); render(); jump('.page.right'); break;
    case 'go-journal': jump('.page.left'); break;
    case 'go-act': jump('.page.right'); break;
    case 'fold': S.ui.fold = !S.ui.fold; save(); render(); break;
    case 'fire': night(Number(arg)); break;
    case 'choice': choose(Number(arg)); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-a="num"]')) { /* handled by click */ }
});

render();
})();
</script>
</body>
</html>
