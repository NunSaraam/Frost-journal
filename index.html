<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>게임콘텐츠과 기말 작업물</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E272E;--bg2:#33414C;--paper:#E7EBE8;--ink:#1F2B36;--pencil:#5E6A74;--accent:#B8431D;--soft:#C4CED4;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{--paper:#2C3337;--ink:#E2E7E9;--pencil:#A1ADB5;--accent:#F07A4B}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 75%) fixed;background-color:var(--bg);color:var(--soft);font-family:'Gowun Batang','Nanum Myeongjo',serif;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:56px 20px 64px}
.hand{font-family:'Nanum Pen Script',cursive;font-weight:400}
header h1{font-size:clamp(2.6rem,7vw,4rem);line-height:1;margin:0 0 10px;color:#EEF0EB}
header p{margin:0;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:40px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--paper);color:var(--ink);border-radius:6px 14px 14px 6px;padding:28px 28px 24px;text-decoration:none;box-shadow:0 18px 40px rgba(0,0,0,.35);transition:transform .15s ease}
.card:hover{transform:translateY(-3px)}
.card:focus-visible{outline:3px dashed var(--accent);outline-offset:4px}
.card .tag{font-size:.85rem;color:var(--accent)}
.card h2{font-size:2.6rem;line-height:1;margin:0}
.card p{margin:0;color:var(--pencil)}
.card .go{margin-top:auto;font-family:'Nanum Pen Script',cursive;font-size:1.5rem;color:var(--ink)}
.links{margin-top:36px;font-size:.92rem}
.links a{color:var(--soft)}
footer{margin-top:48px;font-size:.82rem;color:var(--pencil)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="hand">게임콘텐츠과 기말 작업물</h1>
    <p>[이름] · [학번]</p>
  </header>
  <main class="grid">
    <a class="card" href="diorama/">
      <span class="tag">작업물 1</span>
      <h2 class="hand">디오라마</h2>
      <p>[디오라마 한 줄 소개]</p>
      <span class="go">보러 가기 →</span>
    </a>
    <a class="card" href="game/">
      <span class="tag">작업물 2 · 좀비 아포칼립스 웹게임</span>
      <h2 class="hand">동토일지</h2>
      <p>혹한의 서른 날. 불을 피우면 얼어 죽지 않는다. 그리고 불빛은 감염자를 부른다.</p>
      <span class="go">플레이하기 →</span>
    </a>
  </main>
  <p class="links">
    <a href="docs/동토일지_시스템기획서.pdf">동토일지 시스템 기획서 (PDF)</a> ·
    <a href="docs/scene_compare.png">산장 그림 비교 (평소/위험)</a>
  </p>
  <footer>신구대학교 게임콘텐츠과 · 2026</footer>
</div>
</body>
</html>
